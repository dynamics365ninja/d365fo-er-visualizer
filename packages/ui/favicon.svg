<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 9 46 46" role="img" aria-labelledby="title desc">
  <title id="title">D365FO ER Visualizer favicon</title>
  <desc id="desc">The letters ER in the model, mapping and format gradient of the app's wordmark.</desc>
  <!-- No tile, so it sits on any tab colour. The hues are the --er-model,
       --er-mapping and --er-format tokens of the matching theme. The PNG
       icons keep a dark tile, because home screens need an opaque one. -->
  <style>
    .model { stop-color: #6d5ce7; }
    .mapping { stop-color: #a3308a; }
    .format { stop-color: #c2681a; }
    @media (prefers-color-scheme: dark) {
      .model { stop-color: #a396ff; }
      .mapping { stop-color: #e08fd0; }
      .format { stop-color: #e79a4f; }
    }
  </style>
  <defs>
    <linearGradient id="er" x1="13" y1="26" x2="53" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="model" />
      <stop offset="0.55" class="mapping" />
      <stop offset="1" class="format" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#er)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 19H16v26h12M16 32h10" />
    <path d="M36 45V19h7a7 7 0 0 1 0 14h-7m6 0 7 12" />
  </g>
</svg>
