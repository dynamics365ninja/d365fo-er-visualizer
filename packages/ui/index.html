<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Both entries, so the browser chrome follows the OS the same way the shell
       below and the marketing site do. Values are `--er-bg-soft`. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f8f8" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10161a" />
  <!-- Application shell — no indexable content. The marketing site at / is what search engines should see. -->
  <meta name="robots" content="noindex, follow" />
  <meta name="apple-mobile-web-app-title" content="ER Visualizer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: http://localhost:5173 https://login.microsoftonline.com https://login.microsoft.com https://login.windows.net https://*.dynamics.com https://*.operations.dynamics.com https://*.cloudax.dynamics.com https://*.sandbox.operations.dynamics.com https://*.sandbox.ax.dynamics.com https://*.axcloud.dynamics.com; frame-src 'self' https://login.microsoftonline.com https://login.microsoft.com; form-action 'self' https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" />
  <title>D365FO ER Visualizer</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <!-- Root-relative so Vite rewrites them with the configured base (./ for
       Electron's file:// load, /app/ for the web deployment). -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Paint the shell before the bundle arrives, so the gap between navigation
       and React mounting is not a flash of the wrong theme. Deliberately
       CSS-only: the packaged Electron CSP is script-src 'self', which would
       block an inline theme-bootstrap script — src/main.tsx applies the real
       theme as soon as the module runs.

       Same fallback chain as design-tokens/tokens.css and the marketing site:
       light unless the OS explicitly asks for dark. The literals are
       `--er-bg-soft`, which the tokens are not loaded yet to provide. */
    html, body {
      background: #f4f8f8;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #10161a; }
    }

    /* An explicit choice already on <html> wins over the OS, as in the tokens. */
    html[data-theme='light'], html[data-theme='light'] body { background: #f4f8f8; }
    html[data-theme='dark'], html[data-theme='dark'] body { background: #10161a; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
