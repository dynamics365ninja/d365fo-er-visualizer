<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- `viewport-fit=cover` so the safe-area insets below have something to
       resolve against on notched/rounded tablets and phones. Zooming stays
       enabled deliberately — it is the accessibility escape hatch for the
       dense tree views. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- Both entries, so the browser chrome follows the OS the same way the shell
       below and the marketing site do. Values are `--er-bg-soft`. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f8" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1011" />
  <!-- Application shell — no indexable content. The marketing site at / is what search engines should see. -->
  <meta name="robots" content="noindex, follow" />
  <meta name="apple-mobile-web-app-title" content="ER Visualizer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: http://localhost:5173 https://login.microsoftonline.com https://login.microsoft.com https://login.windows.net https://*.dynamics.com https://*.operations.dynamics.com https://*.cloudax.dynamics.com https://*.sandbox.operations.dynamics.com https://*.sandbox.ax.dynamics.com https://*.axcloud.dynamics.com; frame-src 'self' https://login.microsoftonline.com https://login.microsoft.com; form-action 'self' https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" />
  <title>D365FO ER Visualizer</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <!-- Root-relative so Vite rewrites them with the configured base (./ for
       Electron's file:// load, /app/ for the web deployment). -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Paint the shell before the bundle arrives, so the gap between navigation
       and React mounting is not a flash of the wrong theme. Deliberately
       CSS-only: the packaged Electron CSP is script-src 'self', which would
       block an inline theme-bootstrap script — src/main.tsx applies the real
       theme as soon as the module runs.

       Same fallback chain as design-tokens/tokens.css and the marketing site:
       light unless the OS explicitly asks for dark. The literals are
       `--er-bg-soft`, which the tokens are not loaded yet to provide. */
    html, body {
      background: #f7f7f8;
      /* `100vh` on iOS/iPadOS Safari measures the viewport as if the browser
         chrome were hidden, so a fixed shell gets clipped. `100dvh` tracks the
         live viewport; the `100vh` line stays as the fallback for engines
         without dynamic viewport units. */
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      /* Suppress the 350 ms double-tap-to-zoom delay so taps register at once
         and the app's own double-click handlers stay reliable on touch.
         Pinch-zoom is unaffected. */
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      /* iOS paints a grey flash on every tap; the app has its own :active and
         selection styling. */
      -webkit-tap-highlight-color: transparent;
    }

    /* Scoped to touch: stopping scroll chaining prevents iOS rubber-banding
       the whole shell, but there is no reason to change how a desktop
       browser behaves. */
    @media (pointer: coarse) {
      html, body { overscroll-behavior: none; }
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #0f1011; }
    }

    /* An explicit choice already on <html> wins over the OS, as in the tokens. */
    html[data-theme='light'], html[data-theme='light'] body { background: #f7f7f8; }
    html[data-theme='dark'], html[data-theme='dark'] body { background: #0f1011; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
